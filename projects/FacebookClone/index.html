<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="CONTENT-TYPE">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Facebook - Log in  or Sign upPage</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<div class="left-section">
		<h1>FACEBOOK</h1>
		<p>Welcome to Facebook, connect and share with the people in your life.</p>
	</div>

	<div class="form-card">

		<form action="login.php" method="post" id="log">
			<input type="text" id="uep" placeholder="Email or phone number" required>
			<input type="password" id="password" placeholder="Enter Password" required>
			<button type="submit" id="login-btn">Log In</button>
			<div class="remember">
				<input type="checkbox" name="checkbox" id="remember">
				<label for="remember"><small>Remember username and password</small></label>
			</div>
			<a href="#" class="forgot">Forgotten password?</a>
			<div class="divider"></div>
		</form>

		<button id="signup-btn" for="log">Create New Account</button>
	</div>
</body>
</html>
