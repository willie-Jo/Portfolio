<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>Weather App</h1>
    <p class="subtitle">Check weather for any city</p>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name e.g Lagos">
      <button id="searchBtn">Search</button>
    </div>

    <!-- Weather Display - Hidden by default -->
    <div class="weather-box" id="weatherBox" style="display: none;">
      <h2 id="cityName"></h2>
      <img id="weatherIcon" src="" alt="Weather Icon">
      <h3 id="temperature"></h3>
      <p id="description"></p>
      <div class="details">
        <p>Humidity: <span id="humidity"></span>%</p>
        <p>Wind: <span id="wind"></span> m/s</p>
      </div>
    </div>

    <!-- Error Message -->
    <p class="error" id="errorMsg" style="display: none;"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
