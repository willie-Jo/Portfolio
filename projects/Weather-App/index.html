<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Page Header: Tells user what this page is for-->
  <header class="page-header">
    <h1>Live Weather Checker</h1>
    <p>
      Get real-time weather updates for any city worldwide. Just type a city name in the box and hit Search.
    </p>
  </header>
  
  <!-- Main App Card -->
  <div class="app-container">
    <h2>Weather App</h2>
    <p class="subtitle">Check weather for any city</p>
    
    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name e.g Lagos" autocomplete="off">
      <button id="searchBtn">Search</button>
    </div>
    
    <!-- Weather Display - Hidden by default -->
    <div class="hidden" id="messageBox">
      <!--<h2 id="cityName"></h2>
      <img id="weatherIcon" src="" alt="Weather Icon">
      <h3 id="temperature"></h3>
      <p id="description"></p>
      <div class="details">
        <p>Humidity: <span id="humidity"></span>%</p>
        <p>Wind: <span id="wind"></span> m/s</p>
      </div>-->
    </div>
    
    <!-- Error Message -->
    <!-- <div class="hidden" id="messageBox"></div> -->
  </div>
  
  <script src="script.js"></script>
</body>
</html>
